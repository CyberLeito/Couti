# Dedicated F5 Power menu. Never inherit an image autoboot timeout.
unset timeout
set default=0

menuentry "$VTLANG_RETURN_PREVIOUS" --class=coutiret VTOY_RET {
    true
}

menuentry "$VTLANG_POWER_REBOOT" --class=couti_reboot {
    reboot
}

menuentry "$VTLANG_POWER_HALT" --class=couti_shutdown {
    halt
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "$VTLANG_POWER_BOOT_EFIFW" --class=couti_firmware {
        fwsetup
    }
fi
